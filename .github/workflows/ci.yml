name: CI

on:
  push:
    branches: ["**"] # every pushed branch, so the first push of a branch already runs CI
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true # always the newest patch: security fixes land in patch releases
      - run: mkdir -p web/dist && touch web/dist/index.html
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --audit-level=high

  mysql-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -pdbyson-tests
          - image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: dbyson-tests
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_PASSWORD: dbyson-tests
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true # always the newest patch: security fixes land in patch releases
      - run: go test ./internal/drivers/mysql -run TestIntegration -count=1 -v
        env:
          DBYSON_INTEGRATION_ADDR: 127.0.0.1:${{ job.services.database.ports['3306'] }}

  secure-connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p web/dist && touch web/dist/index.html
      - name: Real MySQL client certificates, query cancellation and mTLS handshakes
        run: |
          docker compose -p dbyson-security-test -f compose.security-test.yml up -d --build --wait --wait-timeout 180 database app-mtls
          docker compose -p dbyson-security-test -f compose.security-test.yml run --rm --no-deps tests
      - name: Stop disposable environment
        if: always()
        run: docker compose -p dbyson-security-test -f compose.security-test.yml down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose -p dbyson-e2e -f compose.e2e.yml up -d --build --wait --wait-timeout 180
      - name: Wait for app
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:18080/api/healthz; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:e2e
        working-directory: web
      - name: Container logs
        if: failure()
        run: docker compose -p dbyson-e2e -f compose.e2e.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
      - name: Stop disposable environment
        if: always()
        run: docker compose -p dbyson-e2e -f compose.e2e.yml down -v

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, mysql-integration, secure-connectivity, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Both architectures must build; the Dockerfile cross-compiles, so no emulation is needed.
      - name: Build linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load linux/amd64 for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dbyson:ci
          cache-from: type=gha
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dbyson:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
