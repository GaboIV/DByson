# Optional local deployment with automatic Docker metadata discovery.
# Build first: docker build -t dbyson:dev .
services:
  app:
    image: dbyson:dev
    container_name: dbyson
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - dbyson-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DBYSON_DOCKER_DISCOVERY_URL: http://discovery:8090
    networks: [default, discovery]
  discovery:
    image: dbyson:dev
    entrypoint: ["/docker-discovery"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [discovery]
networks:
  discovery:
    internal: true
volumes:
  dbyson-data:
    external: true
